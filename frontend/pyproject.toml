[project]
name = "meeting-intelligence-frontend"
version = "0.1.0"
description = "Streamlit dashboard for meeting transcription and action items"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40,<2.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10.0", "ruff>=0.6,<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["streamlit_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
