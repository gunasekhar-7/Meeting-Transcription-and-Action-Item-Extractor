[project]
name = "meeting-intelligence-backend"
version = "0.1.0"
description = "Meeting transcription and action-item intelligence API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0.30,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "pyjwt>=2.9,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27,<1.0",
  "mutagen>=1.47,<2.0",
  "celery[redis]>=5.4,<6.0",
  "redis>=5.0,<7.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2,<2.0"]
diarization = ["pyannote.audio>=4.0,<5.0"]
s3 = ["boto3>=1.35,<2.0"]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: tests that download or run real models",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = false
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
